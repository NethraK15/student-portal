name: RAMAV PR Validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  validate:
    name: Multi-Agent Validation
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the pull request code
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: pr-repo
      # Step 2: Checkout your central RAMAV engine
      - name: Checkout RAMAV Engine
        uses: actions/checkout@v4
        with:
          repository: NethraK15/RAMAV
          path: ramav-engine
      # Step 3: Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # Step 4: Install RAMAV dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ramav-engine/backend/requirements.txt
      # Step 5: Run RAMAV multi-agent validation against this PR
      - name: Run RAMAV Multi-Agent Validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python ramav-engine/scripts/github_pr_bot.py --repo-path ./pr-repo --fail-on-reject
